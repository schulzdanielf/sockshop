kind: Workflow
apiVersion: argoproj.io/v1alpha1
metadata:
  name: catalogue-io-stress
  namespace: litmus
  labels:
    subject: sock-shop_kube-proxy
    workflows.argoproj.io/controller-instanceid: f21787ba-08ee-4649-ab66-c880492636dc
spec:
  templates:
    - name: argowf-chaos
      inputs: {}
      outputs: {}
      metadata: {}
      steps:
        - - name: install-chaos-faults
            template: install-chaos-faults
            arguments: {}
        - - name: run-chaos
            template: run-chaos
            arguments: {}
        - - name: cleanup-chaos-resources
            template: cleanup-chaos-resources
            arguments: {}
    - name: install-chaos-faults
      inputs:
        artifacts:
          - name: install-chaos-faults
            path: /tmp/pod-io-stress.yaml
            raw:
              data: |
                apiVersion: litmuschaos.io/v1alpha1
                description:
                  message: |
                    IO stress on the application pods belonging to an app deployment
                kind: ChaosExperiment
                metadata:
                  name: pod-io-stress
                  labels:
                    name: pod-io-stress
                spec:
                  definition:
                    scope: Namespaced
                    permissions:
                      - apiGroups: [""]
                        resources: ["pods"]
                        verbs: ["create","delete","get","list","patch","update","deletecollection"]
                      - apiGroups: [""]
                        resources: ["events"]
                        verbs: ["create","get","list","patch","update"]
                      - apiGroups: [""]
                        resources: ["configmaps"]
                        verbs: ["get","list"]
                      - apiGroups: [""]
                        resources: ["pods/log"]
                        verbs: ["get","list","watch"]
                      - apiGroups: [""]
                        resources: ["pods/exec"]
                        verbs: ["get","list","create"]
                      - apiGroups: ["apps"]
                        resources: ["deployments","statefulsets","replicasets","daemonsets"]
                        verbs: ["list","get"]
                      - apiGroups: ["batch"]
                        resources: ["jobs"]
                        verbs: ["create","list","get","delete","deletecollection"]
                      - apiGroups: ["litmuschaos.io"]
                        resources: ["chaosengines","chaosexperiments","chaosresults"]
                        verbs: ["create","list","get","patch","update","delete"]
                    image: "litmuschaos.docker.scarf.sh/litmuschaos/go-runner:3.28.0"
                    imagePullPolicy: Always
                    args:
                    - -c
                    - ./experiments -name pod-io-stress
                    command:
                    - /bin/bash
                    env:
                    - name: TOTAL_CHAOS_DURATION
                      value: '120'
                    - name: FILESYSTEM_UTILIZATION_PERCENTAGE
                      value: '10'
                    - name: FILESYSTEM_UTILIZATION_BYTES
                      value: ''
                    - name: NUMBER_OF_WORKERS
                      value: '4'
                    - name: PODS_AFFECTED_PERC
                      value: ''
                    - name: VOLUME_MOUNT_PATH
                      value: ''
                    - name: TARGET_CONTAINER
                      value: ''
                    - name: TARGET_PODS
                      value: ''
                    - name: RAMP_TIME
                      value: ''
                    - name: LIB_IMAGE
                      value: 'litmuschaos.docker.scarf.sh/litmuschaos/go-runner:3.28.0'
                    - name: DEFAULT_HEALTH_CHECK
                      value: 'false'
                    - name: CONTAINER_RUNTIME
                      value: 'docker'
                    - name: SOCKET_PATH
                      value: '/var/run/docker.sock'
                    - name: SEQUENCE
                      value: 'parallel'
                    labels:
                      name: pod-io-stress
      outputs: {}
      metadata: {}
      container:
        name: ""
        image: litmuschaos/k8s:latest
        command:
          - sh
          - -c
        args:
          - kubectl apply -f /tmp/pod-io-stress.yaml -n
            {{workflow.parameters.adminModeNamespace}}
        resources: {}
    - name: run-chaos
      inputs:
        artifacts:
          - name: run-chaos
            path: /tmp/chaosengine-run-chaos.yaml
            raw:
              data: |
                apiVersion: litmuschaos.io/v1alpha1
                kind: ChaosEngine
                metadata:
                  namespace: "{{workflow.parameters.adminModeNamespace}}"
                  labels:
                    context: sock-shop_kube-proxy
                    workflow_run_id: "{{ workflow.uid }}"
                    workflow_name: catalogue-io-stress
                  generateName: run-chaos
                spec:
                  appinfo:
                    appns: sock-shop
                    applabel: name=catalogue
                    appkind: deployment
                  jobCleanUpPolicy: retain
                  engineState: active
                  chaosServiceAccount: litmus-admin
                  experiments:
                    - name: pod-io-stress
                      spec:
                        components:
                          env:
                            - name: TARGET_CONTAINER
                              value: catalogue
                            - name: FILESYSTEM_UTILIZATION_PERCENTAGE
                              value: "10"
                            - name: NUMBER_OF_WORKERS
                              value: "4"
                            - name: TOTAL_CHAOS_DURATION
                              value: "120"
                            - name: CONTAINER_RUNTIME
                              value: docker
                            - name: SOCKET_PATH
                              value: /var/run/docker.sock
      outputs: {}
      metadata:
        labels:
          weight: "10"
      container:
        name: ""
        image: litmuschaos/litmus-checker:2.11.0
        args:
          - -file=/tmp/chaosengine-run-chaos.yaml
          - -saveName=/tmp/engine-name
        resources: {}
    - name: cleanup-chaos-resources
      inputs: {}
      outputs: {}
      metadata: {}
      container:
        name: ""
        image: litmuschaos/k8s:latest
        command:
          - sh
          - -c
        args:
          - kubectl delete chaosengine -l workflow_run_id={{workflow.uid}} -n
            {{workflow.parameters.adminModeNamespace}}
        resources: {}
  entrypoint: argowf-chaos
  arguments:
    parameters:
      - name: adminModeNamespace
        value: litmus
      - name: appNamespace
        value: sock-shop
  serviceAccountName: argo-chaos
  securityContext:
    runAsUser: 1000
    runAsNonRoot: true
status: {}

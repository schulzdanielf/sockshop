apiVersion: v1
kind: Service
metadata:
  name: tempo-history
  namespace: monitoring-history
  labels:
    app: tempo-history
spec:
  type: ClusterIP
  selector:
    app: tempo-history
  ports:
    - name: http
      port: 3200
      targetPort: 3200
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318

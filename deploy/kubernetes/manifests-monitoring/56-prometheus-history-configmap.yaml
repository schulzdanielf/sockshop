apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-history-config
  namespace: monitoring-history
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    storage:
      tsdb:
        out_of_order_time_window: 365d
    scrape_configs:
      - job_name: prometheus-history
        static_configs:
          - targets: ["localhost:9090"]

apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo-history
  namespace: monitoring-history
  labels:
    app: tempo-history
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tempo-history
  template:
    metadata:
      labels:
        app: tempo-history
    spec:
      containers:
        - name: tempo
          image: grafana/tempo:2.5.0
          args:
            - -config.file=/etc/tempo/tempo.yaml
            - -config.expand-env=true
          env:
            - name: HISTORY_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-history-credentials
                  key: history-access-key
            - name: HISTORY_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-history-credentials
                  key: history-secret-key
          ports:
            - name: http
              containerPort: 3200
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          readinessProbe:
            httpGet:
              path: /ready
              port: 3200
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /etc/tempo
              readOnly: true
            - name: data
              mountPath: /var/tempo
      volumes:
        - name: config
          configMap:
            name: tempo-history-config
        - name: data
          persistentVolumeClaim:
            claimName: tempo-history-pvc

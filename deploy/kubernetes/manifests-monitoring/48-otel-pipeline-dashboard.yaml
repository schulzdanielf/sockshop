apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-pipeline-dashboard
  namespace: monitoring
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: otel-pipeline
        orgId: 1
        folder: Observability
        type: file
        disableDeletion: true
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards/otel
  otel-pipeline-health.json: |
    {
      "id": null,
      "uid": "otel-pipeline-health",
      "title": "OpenTelemetry Pipeline Health",
      "tags": ["opentelemetry", "health"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Collector scrape (1 = healthy)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "textMode": "value"
          },
          "targets": [
            {
              "expr": "up{job=\"opentelemetry-collector\"}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Filelog records received / second",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 6,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "single"
            }
          },
          "targets": [
            {
              "expr": "sum(rate(otelcol_receiver_accepted_log_records{receiver=\"filelog\"}[5m]))",
              "legendFormat": "filelog accepted",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Log records delivered to Loki / second",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "single"
            }
          },
          "targets": [
            {
              "expr": "sum(rate(otelcol_exporter_sent_log_records{exporter=\"loki\"}[5m]))",
              "legendFormat": "Loki delivered",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Collector export failures / second",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "expr": "sum(rate(otelcol_exporter_send_failed_metric_points[5m]))",
              "legendFormat": "metrics",
              "refId": "A"
            },
            {
              "expr": "sum(rate(otelcol_exporter_send_failed_log_records[5m]))",
              "legendFormat": "logs",
              "refId": "B"
            },
            {
              "expr": "sum(rate(otelcol_exporter_send_failed_spans[5m]))",
              "legendFormat": "traces",
              "refId": "C"
            }
          ]
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Prometheus targets down",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 16
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "textMode": "value"
          },
          "targets": [
            {
              "expr": "sum(up == 0) or vector(0)",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Collector exporter queue size",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 18,
            "x": 6,
            "y": 16
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "expr": "otelcol_exporter_queue_size",
              "legendFormat": "{{exporter}}",
              "refId": "A"
            }
          ]
        }
      ]
    }
  evaluation-progress.json: |
    {
      "id": null,
      "uid": "evaluation-progress",
      "title": "Progresso das avaliações",
      "tags": ["evaluation", "rca", "tempo"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 2,
      "refresh": "30s",
      "time": {
        "from": "now-7d",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "evaluation_id",
            "label": "Rodada",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "definition": "query_result(topk(1, last_over_time(evaluation_run_started_timestamp_seconds[15d])))",
            "query": {
              "query": "query_result(topk(1, last_over_time(evaluation_run_started_timestamp_seconds[15d])))",
              "refId": "StandardVariableQuery"
            },
            "regex": "/evaluation_id=\"([^\"]+)\"/",
            "refresh": 2,
            "sort": 1,
            "current": {
              "selected": true,
              "text": "test-base-v6-20261107T121952077600Z",
              "value": "test-base-v6-20261107T121952077600Z"
            },
            "options": [],
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "skipUrlSync": false
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "text",
          "title": "Acompanhamento da rodada selecionada",
          "gridPos": {
            "h": 5,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "options": {
            "mode": "markdown",
            "content": "Selecione a rodada no filtro **Rodada**. O progresso é atualizado a cada caso; os resultados de acurácia, recuperação e tokens só são publicados depois que todos os diagnósticos estiverem persistidos e validados, sem expor rótulos ao modelo.\n\nMétricas concluídas permanecem consultáveis por 30 dias. Uma rodada nova iniciada enquanto este dashboard está aberto pode exigir recarregar a página para atualizar o filtro. Traces correlacionados aparecem depois de executar a avaliação com a nova instrumentação; a tabela legada abaixo mantém chamadas sem ID de rodada."
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Estado",
          "description": "0 = diagnóstico em andamento, 1 = cálculo do relatório, 2 = concluído, 3 = falhou.",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 4, "w": 4, "x": 0, "y": 5},
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {"text": "Diagnóstico", "color": "blue"},
                    "1": {"text": "Pontuação", "color": "yellow"},
                    "2": {"text": "Concluída", "color": "green"},
                    "3": {"text": "Falhou", "color": "red"}
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "blue", "value": null},
                  {"color": "yellow", "value": 1},
                  {"color": "green", "value": 2},
                  {"color": "red", "value": 3}
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "textMode": "value"
          },
          "targets": [
            {
              "expr": "last_over_time(evaluation_run_state{evaluation_id=\"$evaluation_id\"}[15d])",
              "instant": true,
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Casos esperados",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 4, "w": 4, "x": 4, "y": 5},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "textMode": "value"
          },
          "targets": [
            {
              "expr": "last_over_time(evaluation_cases_expected{evaluation_id=\"$evaluation_id\"}[15d])",
              "instant": true,
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,

apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-history-config
  namespace: monitoring-history
data:
  loki.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100

    common:
      path_prefix: /loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
      storage:
        s3:
          endpoint: seaweedfs-history.monitoring-history.svc.cluster.local:8333
          bucketnames: history-loki
          access_key_id: ${HISTORY_ACCESS_KEY}
          secret_access_key: ${HISTORY_SECRET_KEY}
          insecure: true
          s3forcepathstyle: true

    schema_config:
      configs:
        - from: 2020-10-24
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: history_index_
            period: 24h

    storage_config:
      tsdb_shipper:
        active_index_directory: /loki/tsdb-index
        cache_location: /loki/tsdb-cache

    compactor:
      working_directory: /loki/compactor
      compaction_interval: 10m
      retention_enabled: true
      retention_delete_delay: 2h
      retention_delete_worker_count: 50
      delete_request_store: s3

    ingester:
      chunk_idle_period: 1m
      max_chunk_age: 10m
      chunk_retain_period: 30s

    limits_config:
      reject_old_samples: true
      reject_old_samples_max_age: 8760h
      retention_period: 8760h
      ingestion_rate_mb: 4
      ingestion_burst_size_mb: 8
      per_stream_rate_limit: 4MB
      per_stream_rate_limit_burst: 8MB
      max_query_parallelism: 4
      max_entries_limit_per_query: 10000

    analytics:
      reporting_enabled: false

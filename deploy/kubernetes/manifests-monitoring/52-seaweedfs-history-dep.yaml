apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs-history
  namespace: monitoring-history
  labels:
    app: seaweedfs-history
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: seaweedfs-history
  template:
    metadata:
      labels:
        app: seaweedfs-history
    spec:
      automountServiceAccountToken: false
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.52
          imagePullPolicy: IfNotPresent
          args:
            - server
            - -dir=/data
            - -s3
            - -s3.config=/etc/seaweedfs/s3.json
            - -volume.max=40
            - -master.telemetry=false
          ports:
            - name: s3
              containerPort: 8333
          readinessProbe:
            tcpSocket:
              port: 8333
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: 8333
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          volumeMounts:
            - name: seaweedfs-data
              mountPath: /data
            - name: s3-credentials
              mountPath: /etc/seaweedfs
              readOnly: true
      volumes:
        - name: seaweedfs-data
          persistentVolumeClaim:
            claimName: seaweedfs-history-pvc
        - name: s3-credentials
          secret:
            secretName: seaweedfs-history-credentials
            defaultMode: 0444
            items:
              - key: s3-config.json
                path: s3.json

# Post-hoc amendment: future runs require a fault-phase mean of at least 80% of
# the live quota. This candidate is not empirically validated for every service.
policy:
  sustained_ratio: 1.25
  sustained_seconds: 60
  minimum_cpu_delta_cores: 0.05

front-end:
  cpu:
    cores: 2
    load: 100
    minimum_quota_fraction: 0.80
    calibration_status: candidate
    rationale: "Post-hoc minimum: fault-phase mean at least 80% of the live application-container CPU quota; no upper bound or sustained-duration requirement."


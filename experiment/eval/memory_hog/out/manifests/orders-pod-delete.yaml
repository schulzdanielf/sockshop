kind: Workflow
apiVersion: argoproj.io/v1alpha1
metadata:
  name: orders-pod-delete
  namespace: litmus
  labels:
    infra_id: f21787ba-08ee-4649-ab66-c880492636dc
    workflows.argoproj.io/controller-instanceid: f21787ba-08ee-4649-ab66-c880492636dc
spec:
  templates:
    - name: argowf-chaos
      inputs: {}
      outputs: {}
      metadata: {}
      steps:
        - - name: install-chaos-faults
            template: install-chaos-faults
            arguments: {}
        - - name: run-chaos
            template: run-chaos
            arguments: {}
        - - name: cleanup-chaos-resources
            template: cleanup-chaos-resources
            arguments: {}
    - name: install-chaos-faults
      inputs:
        artifacts:
          - name: install-chaos-faults
            path: /tmp/pod-delete.yaml
            raw:
              data: >
                apiVersion: litmuschaos.io/v1alpha1

                description:
                  message: |
                    Deletes a pod belonging to a deployment/statefulset/daemonset
                kind: ChaosExperiment

                metadata:
                  name: pod-delete
                spec:
                  definition:
                    scope: Namespaced
                    permissions:
                      - apiGroups: [""]
                        resources: ["pods","events"]
                        verbs: ["create","list","get","patch","update","delete","deletecollection"]
                      - apiGroups: [""]
                        resources: ["pods/log"]
                        verbs: ["get","list","watch"]
                      - apiGroups: ["batch"]
                        resources: ["jobs"]
                        verbs: ["create","list","get","delete","deletecollection"]
                      - apiGroups: ["apps"]
                        resources: ["deployments","statefulsets","daemonsets","replicasets"]
                        verbs: ["list","get"]
                      - apiGroups: ["litmuschaos.io"]
                        resources: ["chaosengines","chaosexperiments","chaosresults"]
                        verbs: ["create","list","get","patch","update","delete"]
                    image: "litmuschaos.docker.scarf.sh/litmuschaos/go-runner:3.28.0"
                    imagePullPolicy: Always
                    args:
                    - -c
                    - ./experiments -name pod-delete
                    command:
                    - /bin/bash
                    env:
                    - name: TOTAL_CHAOS_DURATION
                      value: '15'
                    - name: RAMP_TIME
                      value: ''
                    - name: FORCE
                      value: 'true'
                    - name: CHAOS_INTERVAL
                      value: '5'
                    - name: PODS_AFFECTED_PERC
                      value: ''
                    - name: TARGET_PODS
                      value: ''
                    - name: SEQUENCE
                      value: 'parallel'
                    labels:
                      name: pod-delete
      outputs: {}
      metadata: {}
      container:
        name: ""
        image: litmuschaos/k8s:latest
        command:
          - sh
          - -c
        args:
          - kubectl apply -f /tmp/pod-delete.yaml -n
            {{workflow.parameters.adminModeNamespace}}
        resources: {}
    - name: run-chaos
      inputs:
        artifacts:
          - name: run-chaos
            path: /tmp/chaosengine-run-chaos.yaml
            raw:
              data: >
                apiVersion: litmuschaos.io/v1alpha1

                kind: ChaosEngine

                metadata:
                  namespace: "{{workflow.parameters.adminModeNamespace}}"
                  labels:
                    context: sock-shop_kube-proxy
                    workflow_run_id: "{{ workflow.uid }}"
                    workflow_name: orders-pod-delete
                  generateName: run-chaos
                spec:
                  appinfo:
                    appns: sock-shop
                    applabel: name=orders
                    appkind: deployment
                  jobCleanUpPolicy: retain
                  engineState: active
                  chaosServiceAccount: litmus-admin
                  experiments:
                    - name: pod-delete
                      spec:
                        components:
                          env:
                            - name: TOTAL_CHAOS_DURATION
                              value: "30"
                            - name: CHAOS_INTERVAL
                              value: "10"
                            - name: FORCE
                              value: "false"
                            - name: SEQUENCE
                              value: "parallel"
      outputs: {}
      metadata:
        labels:
          weight: "10"
      container:
        name: ""
        image: litmuschaos/litmus-checker:2.11.0
        args:
          - -file=/tmp/chaosengine-run-chaos.yaml
          - -saveName=/tmp/engine-name
        resources: {}
    - name: cleanup-chaos-resources
      inputs: {}
      outputs: {}
      metadata: {}
      container:
        name: ""
        image: litmuschaos/k8s:latest
        command:
          - sh
          - -c
        args:
          - kubectl delete chaosengine -l workflow_run_id={{workflow.uid}} -n
            {{workflow.parameters.adminModeNamespace}}
        resources: {}
  entrypoint: argowf-chaos
  arguments:
    parameters:
      - name: adminModeNamespace
        value: litmus
      - name: appNamespace
        value: sock-shop
  serviceAccountName: argo-chaos
  securityContext:
    runAsUser: 1000
    runAsNonRoot: true
status: {}

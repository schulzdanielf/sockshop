# ────────────────────────────────────────────────────────────────────────────
# Multi-chaos evaluation harness — declarative matrix
# ────────────────────────────────────────────────────────────────────────────
# Loaded by experiment/eval/memory_hog/runner.py and
# experiment/eval/memory_hog/generate_chaos_manifests.py.
#
# Goal: inject several chaos types (memory-hog, cpu-hog, pod-delete) in a mix
# of services to build up the RAG corpus (train phase) and then evaluate
# multiple LLM analysis strategies on a held-out, also-mixed test set.

# ── Platform / cluster wiring ───────────────────────────────────────────────
platform:
  api_base: "http://127.0.0.1:8010"
  user_role: "chaos_engineer"
  initiated_by: "multi-chaos-harness"
  # Per-run polling
  poll_interval_seconds: 15
  run_timeout_seconds: 1800     # 30 min hard cap per run

cluster:
  app_namespace: "sock-shop"
  litmus_namespace: "litmus"
  argo_controller_instanceid: "f21787ba-08ee-4649-ab66-c880492636dc"

# Stable corpus boundary for repeated executions of this evaluation campaign.
# TRAIN and TEST runs share this ID; the database version/run_id distinguish them.
experiment_campaign_id: "multi-chaos-eval-v2"

# ── Chaos types (one entry per fault injected by the harness) ──────────────
# Each entry maps to a generated Argo Workflow template named
# "<service>-<template_suffix>" (e.g. ``carts-cpu-hog``).
#
# `short` is used as a stable prefix in the per-run experiment_id
# (memhog / cpuhog / poddel) so CSV rows are easy to grep.
#
# `fault_category` is the value the harness writes into experiment metadata
# as the ground-truth fault label; it must be one of
# ``allowed_fault_categories`` declared in the sock-shop system card.
resource_chaos:
  duration_seconds: 120
  cpu_load_percentage: 100
  memory_load_percentage: 70

chaos_types:
  - name: memory-hog
    template_suffix: memory-hog
    short: memhog
    fault_category: memory-exhaustion
    env:
      memory_consumption_mb: 500        # Bootstrap template default; per-run value comes from the target limit.
      total_chaos_duration_seconds: 120
      chaos_interval_seconds: 10        # → CHAOS_INTERVAL

  - name: cpu-hog
    template_suffix: cpu-hog
    short: cpuhog
    fault_category: cpu-exhaustion
    env:
      cpu_cores: 0                      # Percentage mode requires CPU_CORES=0.
      cpu_load_percentage: 100          # → CPU_LOAD
      total_chaos_duration_seconds: 120
      chaos_interval_seconds: 10        # → CHAOS_INTERVAL

  - name: pod-delete
    template_suffix: pod-delete
    short: poddel
    fault_category: pod-failure
    env:
      total_chaos_duration_seconds: 30  # → TOTAL_CHAOS_DURATION
      chaos_interval_seconds: 10        # → CHAOS_INTERVAL
      force: false                      # → FORCE

  # ── Extended fault catalog ───────────────────────────────────────────────
  # Baselines live in deploy/kubernetes/manifests-chaos/catalogue-<fault>.yaml.
  # Empirically smoke-tested on this cluster (docker-desktop / WSL2 kernel
  # 6.6.x). Runnability status:
  #   network-latency   ✅ runs — requires host `sudo modprobe sch_netem`
  #   network-loss      ✅ runs — requires host `sudo modprobe sch_netem`
  #   http-status-code  ✅ runs (port-80 services; NOT front-end:8079)
  #   container-kill    ✅ runs
  #   io-stress         ❌ does NOT run here — stress-ng --hdd uses O_DIRECT,
  #                        unsupported by the WSL2 overlayfs (exit status 1).
  #   dns-error         ❌ does NOT run here — dns_interceptor exits 1 inside
  #                        the target netns even with NFQUEUE modules loaded.
  # The 4 runnable faults are wired into train/test below. io-stress and
  # dns-error are kept as definitions (env + label) but left out of the matrix
  # so they can be enabled on a compatible cluster without code changes.
  # Run `make chaos-enable-netem` before any network-* run (see deploy README).
  - name: network-latency
    template_suffix: network-latency
    short: netlat
    fault_category: network-latency        # already in sock-shop allowed list
    env:
      network_latency_ms: 500               # → NETWORK_LATENCY; keep below the default 1s probe timeout
      total_chaos_duration_seconds: 120    # → TOTAL_CHAOS_DURATION

  - name: network-loss
    template_suffix: network-loss
    short: netloss
    fault_category: network-loss           # added to sock-shop allowed list
    env:
      network_packet_loss_percentage: 100  # → NETWORK_PACKET_LOSS_PERCENTAGE
      total_chaos_duration_seconds: 120    # → TOTAL_CHAOS_DURATION

  - name: dns-error
    template_suffix: dns-error
    short: dnserr
    fault_category: dns-failure            # added to sock-shop allowed list
    # ❌ NOT in the matrix: dns_interceptor incompatible with WSL2 kernel.
    env:
      total_chaos_duration_seconds: 120    # → TOTAL_CHAOS_DURATION

  - name: io-stress
    template_suffix: io-stress
    short: iostress
    fault_category: io-exhaustion          # added to sock-shop allowed list
    # ❌ NOT in the matrix: incompatible with docker-desktop WSL2 overlayfs.
    env:
      filesystem_utilization_percentage: 10  # → FILESYSTEM_UTILIZATION_PERCENTAGE
      number_of_workers: 4                   # → NUMBER_OF_WORKERS
      total_chaos_duration_seconds: 120      # → TOTAL_CHAOS_DURATION

  - name: http-status-code
    template_suffix: http-status-code
    short: httperr
    fault_category: http-error             # added to sock-shop allowed list
    env:
      status_code: 500                     # → STATUS_CODE
      total_chaos_duration_seconds: 120    # → TOTAL_CHAOS_DURATION

  - name: container-kill
    template_suffix: container-kill
    short: ckill
    fault_category: pod-failure            # reuses existing category (restart spike)
    env:
      total_chaos_duration_seconds: 20     # → TOTAL_CHAOS_DURATION
      chaos_interval_seconds: 10           # → CHAOS_INTERVAL

# ── Experiment timeline (passed into experiment spec → engine) ─────────────
timeline:
  baseline_seconds: 30
  warmup_seconds: 30
  fault_duration_seconds: 150         # > 120s chaos duration to capture tail
  post_recovery_observation_seconds: 180
  sampling_interval_seconds: 5

# ── Load profile (locust) ───────────────────────────────────────────────────
# Uses the in-cluster `locust-web` deployment in the `loadtest` namespace
# (already running). The plugin shells into the pod via kubectl exec.
load_profile:
  provider: "locust"
  command: "kubectl -n loadtest exec deploy/locust-web -- locust"
  locust_file: "/mnt/locust/locustfile.py"
  host: "http://front-end.sock-shop.svc.cluster.local"
  users: 30
  spawn_rate: 5
  grace_seconds: 30

# ── SLO thresholds (used by engine for resilient/degraded label) ───────────
# The `error_rate` query is expressed in PERCENT (0–100), so the threshold
# must be too: 5.0 == 5 %. The legacy value 0.05 was effectively 0.05 % and
# flagged any single 5xx as a violation.
# `*_relative_factor`: effective threshold = max(absolute, factor × run
# baseline mean) so a service whose baseline P95 already exceeds 800 ms
# (front-end under 30 users) is not labelled degraded by load alone.
slo:
  error_rate_threshold: 5.0
  error_rate_relative_factor: 3.0
  latency_p95_threshold_ms: 800
  latency_p95_relative_factor: 1.5
  recovery_tolerance_pct: 0.20
  max_recovery_seconds: 600

# ── Execution order / controls ──────────────────────────────────────────────
# shuffle: interleave (service × fault × replica) cells deterministically so
# cluster drift over a long session is not confounded with one cell.
# start_jitter_max_seconds: random pause [0, N] before each run so cells do not
# always start at the same offset from the previous run's recovery.
# Sham controls (chaos_type: none) are declared as ordinary cells with
# service "none"; same schedule and load, no injection.
ordering:
  shuffle: false
  seed: 20260930
  start_jitter_max_seconds: 0

# ── Train / Test split — mixed chaos cells ─────────────────────────────────
# Each cell is a (service, chaos_type) pair. Train cells seed the RAG corpus;
# their runs are also evaluated, but the evaluation focus is the held-out
# test cells. Both phases purposely mix all three chaos types.
#
# `chaos_type` must match one of the `chaos_types[].name` entries above.
#
# IMPORTANT: every (service, chaos_type) listed under `test_experiments`
# MUST also appear under `train_experiments`. The harness reserves `replicas`
# runs for training and the SAME `replicas` for testing — the two replica
# groups share the cell but are partitioned by `is_training`. Without an
# in-distribution training cell the RAG corpus has nothing similar to
# retrieve, collapsing the eval to a zero-shot transfer measurement.
#
# DBs and rabbitmq are intentionally excluded: chaos on a stateful pod drops
# every consumer, which makes the ground truth ambiguous (the LLM may name
# the symptomatic service rather than the injected one).
train_experiments:
  - {service: catalogue, chaos_type: memory-hog}
  - {service: carts,     chaos_type: pod-delete}
  - {service: orders,    chaos_type: cpu-hog}
  - {service: payment,   chaos_type: memory-hog}
  - {service: payment,   chaos_type: cpu-hog}
  - {service: user,      chaos_type: pod-delete}
  - {service: shipping,  chaos_type: pod-delete}
  - {service: queue-master, chaos_type: memory-hog}
  - {service: front-end,   chaos_type: cpu-hog}
  - {service: orders,      chaos_type: memory-hog}
  # Extended faults (runnable on docker-desktop WSL2 — see chaos_types notes).
  # network-* require `make chaos-enable-netem` (sch_netem) before running.
  - {service: catalogue, chaos_type: network-latency}
  - {service: carts,     chaos_type: network-loss}
  - {service: user,      chaos_type: http-status-code}   # port-80 service
  - {service: orders,    chaos_type: container-kill}
  # Additional historical cells retained in the GAT corpus and eligible for retry.
  - {service: carts,        chaos_type: container-kill}
  - {service: shipping,     chaos_type: container-kill}
  - {service: user,         chaos_type: container-kill}
  - {service: catalogue,    chaos_type: http-status-code}
  - {service: carts,        chaos_type: http-status-code}
  - {service: payment,      chaos_type: http-status-code}
  - {service: front-end,    chaos_type: network-latency}
  - {service: orders,       chaos_type: network-latency}
  - {service: shipping,     chaos_type: network-latency}
  - {service: user,         chaos_type: network-latency}
  - {service: payment,      chaos_type: network-loss}

test_experiments:
  - {service: user,         chaos_type: memory-hog}
  - {service: user,         chaos_type: cpu-hog}
  - {service: shipping,     chaos_type: pod-delete}
  - {service: queue-master, chaos_type: cpu-hog}
  - {service: front-end,    chaos_type: pod-delete}
  - {service: orders,       chaos_type: memory-hog}
  # Extended faults — held-out on different services than their train cells.
  - {service: payment,      chaos_type: network-latency}
  - {service: shipping,     chaos_type: network-loss}
  - {service: orders,       chaos_type: http-status-code}  # port-80 service
  - {service: user,         chaos_type: container-kill}

replicas: 3                            # repetitions per (service, chaos_type)

# ── Evaluation strategies (held-out runs × every strategy) ─────────────────
# All call POST /api/runs/{run_id}/llm-analysis?force=true with these params.
# Special system_id "__none__" forces the system-card fallback path.
strategies:
  - name: "S0_no_rag"
    mode: "embedding"
    limit: 0
    system_id: "sock-shop"
    budget_tokens: 3200
    max_new_tokens: 1024

  - name: "S1_rag_tags"
    mode: "tags"
    limit: 3
    system_id: "sock-shop"
    budget_tokens: 3200
    max_new_tokens: 1024

  - name: "S2_rag_embeddings"
    mode: "embedding"
    limit: 3
    system_id: "sock-shop"
    budget_tokens: 3200
    max_new_tokens: 1024

  - name: "S3_rag_hybrid"
    mode: "hybrid"
    limit: 3
    system_id: "sock-shop"
    budget_tokens: 3200
    max_new_tokens: 1024

  - name: "S4_rag_embeddings_no_card"
    mode: "embedding"
    limit: 3
    system_id: "__none__"
    budget_tokens: 3200
    max_new_tokens: 1024

  - name: "S5_rag_short_budget"
    mode: "embedding"
    limit: 3
    system_id: "sock-shop"
    budget_tokens: 1600
    max_new_tokens: 1024

# ── Output ─────────────────────────────────────────────────────────────────
output:
  results_dir: "experiment/eval/memory_hog/out"
  runs_csv: "runs.csv"                # one row per (service, replica)
  evaluation_csv: "evaluation.csv"    # one row per (run_id, strategy)
  manifests_dir: "manifests"          # generated Argo workflow YAMLs
